<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2a4a2a"/><stop offset="100%" stop-color="#1a1a2e"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <!-- Body -->
  <ellipse cx="128" cy="200" rx="50" ry="15" fill="#1a1a1a" opacity="0.5"/>
  <rect x="100" y="90" width="56" height="100" rx="8" fill="#d4c5a0" stroke="#8b7d5e" stroke-width="2"/>
  <!-- Skull head -->
  <circle cx="128" cy="70" r="35" fill="#e8dcc8" stroke="#8b7d5e" stroke-width="2"/>
  <circle cx="115" cy="62" r="8" fill="#2d5a2d" filter="url(#glow)"/>
  <circle cx="141" cy="62" r="8" fill="#2d5a2d" filter="url(#glow)"/>
  <path d="M118 80 L128 88 L138 80" fill="none" stroke="#4a3f2f" stroke-width="2"/>
  <!-- Arms -->
  <rect x="70" y="100" width="30" height="14" rx="5" fill="#d4c5a0" stroke="#8b7d5e" stroke-width="1.5" transform="rotate(-15 85 107)"/>
  <rect x="156" y="100" width="30" height="14" rx="5" fill="#d4c5a0" stroke="#8b7d5e" stroke-width="1.5" transform="rotate(15 171 107)"/>
  <!-- Moss patches -->
  <circle cx="110" cy="120" r="6" fill="#4a7a4a" opacity="0.7"/>
  <circle cx="145" cy="140" r="5" fill="#3a6a3a" opacity="0.6"/>
  <!-- Label -->
  <text x="128" y="240" text-anchor="middle" fill="#9aca9a" font-family="sans-serif" font-size="14" font-weight="bold">BONE GOLEM</text>
</svg>
