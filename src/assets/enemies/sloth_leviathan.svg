<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0a2a4a"/><stop offset="100%" stop-color="#1a1a2e"/></radialGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#3a6a8a"/><stop offset="100%" stop-color="#1a4a6a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <!-- Water ripples -->
  <ellipse cx="128" cy="195" rx="80" ry="15" fill="none" stroke="#4a8aba" stroke-width="1" opacity="0.3"/>
  <ellipse cx="128" cy="200" rx="70" ry="12" fill="none" stroke="#4a8aba" stroke-width="1" opacity="0.2"/>
  <!-- Massive serpentine body rising from water -->
  <path d="M60 200 Q50 160 70 130 Q90 100 110 90 Q130 80 140 85 Q160 90 175 110 Q190 140 195 180 Q198 200 190 210" fill="url(#body)" stroke="#2a5a7a" stroke-width="2"/>
  <!-- Head -->
  <ellipse cx="110" cy="80" rx="30" ry="22" fill="#4a7a9a" stroke="#2a5a7a" stroke-width="2"/>
  <!-- Sleepy half-closed eyes -->
  <path d="M95 73 Q102 70 109 73" fill="none" stroke="#0af" stroke-width="3" filter="url(#glow)"/>
  <path d="M115 73 Q122 70 129 73" fill="none" stroke="#0af" stroke-width="3" filter="url(#glow)"/>
  <!-- Drowsy mouth -->
  <path d="M100 90 Q110 95 120 90" fill="none" stroke="#1a4a6a" stroke-width="2"/>
  <!-- Fins -->
  <path d="M140 85 L155 65 L150 90" fill="#3a6a8a" stroke="#2a5a7a" stroke-width="1"/>
  <path d="M165 110 L180 90 L175 115" fill="#3a6a8a" stroke="#2a5a7a" stroke-width="1"/>
  <!-- Barnacles/bumps -->
  <circle cx="130" cy="105" r="4" fill="#5a8aaa" opacity="0.6"/>
  <circle cx="150" cy="125" r="3" fill="#5a8aaa" opacity="0.5"/>
  <circle cx="170" cy="150" r="5" fill="#5a8aaa" opacity="0.4"/>
  <!-- Water bubbles -->
  <circle cx="80" cy="180" r="3" fill="none" stroke="#6aaaca" stroke-width="1" opacity="0.5"/>
  <circle cx="160" cy="175" r="4" fill="none" stroke="#6aaaca" stroke-width="1" opacity="0.4"/>
  <text x="128" y="240" text-anchor="middle" fill="#4a9aca" font-family="sans-serif" font-size="12" font-weight="bold">SLOTH LEVIATHAN</text>
</svg>
