<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2a2a3a"/><stop offset="100%" stop-color="#1a1a2e"/></radialGradient>
    <linearGradient id="mirror" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8ac" stop-opacity="0.6"/><stop offset="50%" stop-color="#fff" stop-opacity="0.3"/><stop offset="100%" stop-color="#8ac" stop-opacity="0.6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <!-- Stand -->
  <rect x="120" y="180" width="16" height="30" fill="#8a7a5a"/>
  <ellipse cx="128" cy="212" rx="30" ry="8" fill="#6a5a3a"/>
  <!-- Mirror frame -->
  <ellipse cx="128" cy="115" rx="50" ry="65" fill="#b8960c" stroke="#dab52c" stroke-width="3"/>
  <!-- Mirror surface -->
  <ellipse cx="128" cy="115" rx="43" ry="58" fill="url(#mirror)"/>
  <!-- Reflection face (distorted) -->
  <circle cx="118" cy="100" r="6" fill="#cc44cc" filter="url(#glow)" opacity="0.6"/>
  <circle cx="138" cy="100" r="6" fill="#cc44cc" filter="url(#glow)" opacity="0.6"/>
  <path d="M115 120 Q128 135 141 120" fill="none" stroke="#cc44cc" stroke-width="2" opacity="0.5"/>
  <!-- Cracks emanating -->
  <line x1="128" y1="85" x2="128" y2="60" stroke="#ddd" stroke-width="1" opacity="0.4"/>
  <line x1="105" y1="90" x2="88" y2="75" stroke="#ddd" stroke-width="1" opacity="0.3"/>
  <line x1="151" y1="90" x2="168" y2="75" stroke="#ddd" stroke-width="1" opacity="0.3"/>
  <!-- Sparkle decoration -->
  <text x="85" y="80" fill="#dab52c" font-size="16" opacity="0.7">✦</text>
  <text x="165" y="85" fill="#dab52c" font-size="12" opacity="0.5">✦</text>
  <text x="128" y="240" text-anchor="middle" fill="#dab52c" font-family="sans-serif" font-size="13" font-weight="bold">VANITY MIRROR</text>
</svg>
